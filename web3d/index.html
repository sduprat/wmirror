<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wmirror 3D reachability</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-2: #1a2438;
        --line: #2a3d5a;
        --text: #e8edf8;
        --muted: #8ea0c7;
        --green: #53d68c;
        --red: #ff6b6b;
        --blue: #5ab4ff;
        --yellow: #f7d779;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }

      body {
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 100vh;
      }

      .panel {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px;
        overflow: auto;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.2rem;
      }

      .group {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 14px;
      }

      .group h2 {
        margin: 0 0 12px;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .row label {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .row input[type="range"] {
        width: 150px;
      }

      .row .value {
        min-width: 54px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
      }

      .stat .label {
        display: block;
        font-size: 0.68rem;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .stat .value {
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--blue), #7b8cff);
        color: white;
        font-weight: 600;
        padding: 10px 12px;
        cursor: pointer;
        margin-top: 8px;
      }

      .viewport {
        position: relative;
        background: radial-gradient(circle at top, #14213d, var(--bg) 56%);
        min-height: 100vh;
        min-width: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }

      .legend {
        position: absolute;
        left: 16px;
        bottom: 16px;
        background: rgba(10, 16, 30, 0.7);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 0.76rem;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .green { background: var(--green); }
      .red { background: var(--red); }
      .blue { background: var(--blue); }
      .yellow { background: var(--yellow); }
    </style>
  </head>
  <body>
    <aside class="panel">
      <h1>wmirror 3D reachability</h1>

      <div class="group">
        <h2>Target room</h2>

        <div class="row">
          <label for="targetX">X</label>
          <input id="targetX" type="range" min="-8" max="8" step="0.1" value="0" />
          <span id="targetXVal" class="value">0.0</span>
        </div>

        <div class="row">
          <label for="targetY">Y</label>
          <input id="targetY" type="range" min="-8" max="8" step="0.1" value="0" />
          <span id="targetYVal" class="value">0.0</span>
        </div>

        <div class="row">
          <label for="targetZ">Z</label>
          <input id="targetZ" type="range" min="0" max="5" step="0.1" value="2.5" />
          <span id="targetZVal" class="value">2.5</span>
        </div>
      </div>

      <div class="group">
        <h2>Servo constraints</h2>

        <div class="row">
          <label for="servoHMin">H min</label>
          <input id="servoHMin" type="range" min="0" max="180" step="1" value="0" />
          <span id="servoHMinVal" class="value">0</span>
        </div>

        <div class="row">
          <label for="servoHMax">H max</label>
          <input id="servoHMax" type="range" min="0" max="180" step="1" value="180" />
          <span id="servoHMaxVal" class="value">180</span>
        </div>

        <div class="row">
          <label for="servoVMin">V min</label>
          <input id="servoVMin" type="range" min="0" max="90" step="1" value="0" />
          <span id="servoVMinVal" class="value">0</span>
        </div>

        <div class="row">
          <label for="servoVMax">V max</label>
          <input id="servoVMax" type="range" min="0" max="90" step="1" value="90" />
          <span id="servoVMaxVal" class="value">90</span>
        </div>
      </div>

      <div class="group">
        <h2>Sun</h2>

        <div class="row">
          <label for="sunAz">Azimuth</label>
          <input id="sunAz" type="range" min="0" max="360" step="1" value="240" />
          <span id="sunAzVal" class="value">240</span>
        </div>

        <div class="row">
          <label for="sunEl">Altitude</label>
          <input id="sunEl" type="range" min="-90" max="90" step="1" value="15" />
          <span id="sunElVal" class="value">15</span>
        </div>
      </div>

      <div class="group">
        <h2>Outcome</h2>
        <div class="stats">
          <div class="stat">
            <span class="label">azimuth</span>
            <span id="outAz" class="value">--</span>
          </div>
          <div class="stat">
            <span class="label">altitude</span>
            <span id="outEl" class="value">--</span>
          </div>
          <div class="stat">
            <span class="label">servo H</span>
            <span id="outH" class="value">--</span>
          </div>
          <div class="stat">
            <span class="label">servo V</span>
            <span id="outV" class="value">--</span>
          </div>
        </div>

        <button id="scanBtn">Scan reachable area</button>
        <button id="toggleRotateBtn" type="button">Rotation: off</button>
      </div>
    </aside>

    <main class="viewport">
      <canvas id="scene"></canvas>
      <div class="legend">
        <div class="legend-row"><span class="dot green"></span> reachable</div>
        <div class="legend-row"><span class="dot red"></span> unreachable</div>
        <div class="legend-row"><span class="dot blue"></span> sun direction</div>
        <div class="legend-row"><span class="dot yellow"></span> target</div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="./logic.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
